# Personal application and notification shortcuts.

# Close one displayed notification without invoking its action.
bindsym $mod+BackSpace exec --no-startup-id dunstctl close

# Choose an application, then return to the default bindings.
set $mode_launch Launch: [Enter] terminal, [c] Codex, [b] browser, [BackSpace] notification action, [Esc] cancel
bindsym $mod+Return mode "$mode_launch"

mode "$mode_launch" {
    bindsym Return exec ptyxis --new-window; mode "default"
    bindsym c exec "ptyxis --new-window -- bash -c '~/.local/bin/codex --not-so-yolo; exec bash -i'"; mode "default"
    bindsym b exec google-chrome-stable --new-window; mode "default"
    bindsym BackSpace exec --no-startup-id dunstctl action 0; mode "default"
    bindsym Escape mode "default"
}
