# Personal application shortcuts.

# Choose an application, then return to the default bindings.
set $mode_launch Launch: [Enter] Codex, [t] terminal, [b] browser, [Esc] cancel
bindsym $mod+Return mode "$mode_launch"

mode "$mode_launch" {
    bindsym Return exec "ptyxis --new-window -- bash -c '~/.local/bin/codex --not-so-yolo; exec bash -i'"; mode "default"
    bindsym t exec ptyxis --new-window; mode "default"
    bindsym b exec google-chrome-stable --new-window; mode "default"
    bindsym Escape mode "default"
}
