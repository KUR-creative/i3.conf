# Personal application and notification shortcuts.

# A fresh Ptyxis process must open only the requested window, not restore old ones.
# This persists in GSettings; normal i3 startup also reapplies the preference.
exec --no-startup-id gsettings set org.gnome.Ptyxis restore-session false

# Close one displayed notification without invoking its action.
bindsym $mod+F12 exec --no-startup-id dunstctl close
bindsym $mod+BackSpace exec --no-startup-id dunstctl action 0; mode "default"

# Select a screenshot region after the Print key is released.
bindsym --release Print exec --no-startup-id flameshot gui

# Choose an application, then return to the default bindings.
set $mode_launch Launch: [Enter] terminal, [c] Codex, [b] browser, [BackSpace] notification action, [Esc] cancel
# Enter launch mode on release so the same Return release cannot also launch.
bindsym --release $mod+Return mode "$mode_launch"

mode "$mode_launch" {
    # Release Enter and leave launch mode before sending keys to the active terminal.
    # An absent active window (empty workspace) takes the normal launch branch.
    bindsym --release Return mode "default"; exec --no-startup-id \
        "if launch_window_id=$(xdotool getactivewindow 2>/dev/null) && xprop -id $launch_window_id WM_CLASS 2>/dev/null | grep -q ', .ptyxis.$'; then \
            xdotool key --clearmodifiers ctrl+shift+n; \
        else \
            G_RESOURCE_OVERLAYS=/org/gnome/Ptyxis=$HOME/.config/ptyxis-no-header ptyxis --new-window; \
        fi"
    bindsym a exec "ptyxis --new-window -- bash -c '~/.local/bin/codex --not-so-yolo; exec bash -i'"; mode "default"
    bindsym b exec google-chrome-stable --new-window; mode "default"
    bindsym Escape mode "default"
}

bindsym $mod+Shift+w split v; layout tabbed
