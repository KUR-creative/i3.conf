bindcode $mod+Mod2+83 workspace --no-auto-back-and-forth number $left4; workspace --no-auto-back-and-forth number $right4
bindcode $mod+84 workspace --no-auto-back-and-forth number $left5; workspace --no-auto-back-and-forth number $right5
