# Internal workspace slots. Display names and new key assignments come later.
set $right1 "1"
set $right2 "2"
set $right3 "3"
set $right4 "4"
set $right5 "5"
set $right6 "6"
set $right7 "7"
set $right8 "8"
set $right9 "9"
set $right10 "10"

set $left1 "11"
set $left2 "12"
set $left3 "13"
set $left4 "14"
set $left5 "15"
set $left6 "16"
set $left7 "17"
set $left8 "18"
set $left9 "19"
set $left10 "20"

# Preserve each existing shortcut's destination during renumbering.
# switch to workspace
bindsym $mod+1 workspace number $left1
bindsym $mod+2 workspace number $right1
bindsym $mod+3 workspace number $left2
bindsym $mod+4 workspace number $right2
bindsym $mod+5 workspace number $left3
bindsym $mod+6 workspace number $right3
bindsym $mod+7 workspace number $left4
bindsym $mod+8 workspace number $right4
bindsym $mod+9 workspace number $left5
bindsym $mod+0 workspace number $right5

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $left1
bindsym $mod+Shift+2 move container to workspace number $right1
bindsym $mod+Shift+3 move container to workspace number $left2
bindsym $mod+Shift+4 move container to workspace number $right2
bindsym $mod+Shift+5 move container to workspace number $left3
bindsym $mod+Shift+6 move container to workspace number $right3
bindsym $mod+Shift+7 move container to workspace number $left4
bindsym $mod+Shift+8 move container to workspace number $right4
bindsym $mod+Shift+9 move container to workspace number $left5
bindsym $mod+Shift+0 move container to workspace number $right5

## My own settings
# Left workspaces (all ten slots)
workspace $left1 output DP-1
workspace $left2 output DP-1
workspace $left3 output DP-1
workspace $left4 output DP-1
workspace $left5 output DP-1
workspace $left6 output DP-1
workspace $left7 output DP-1
workspace $left8 output DP-1
workspace $left9 output DP-1
workspace $left10 output DP-1

# Right workspaces (all ten slots)
workspace $right1 output HDMI-0
workspace $right2 output HDMI-0
workspace $right3 output HDMI-0
workspace $right4 output HDMI-0
workspace $right5 output HDMI-0
workspace $right6 output HDMI-0
workspace $right7 output HDMI-0
workspace $right8 output HDMI-0
workspace $right9 output HDMI-0
workspace $right10 output HDMI-0

# Switch LR pair together
bindsym $mod+F1 workspace number $right1; workspace number $left1;
bindsym $mod+F2 workspace number $left1; workspace number $right1;
bindsym $mod+F3 workspace number $right2; workspace number $left2;
bindsym $mod+F4 workspace number $left2; workspace number $right2;
bindsym $mod+F5 workspace number $right3; workspace number $left3;
bindsym $mod+F6 workspace number $left3; workspace number $right3;
bindsym $mod+F7 workspace number $right4; workspace number $left4;
bindsym $mod+F8 workspace number $left4; workspace number $right4;
bindsym $mod+F9 workspace number $right5; workspace number $left5;
bindsym $mod+F10 workspace number $left5; workspace number $right5;

# Ctrl+Tab
bindsym Mod1+Tab workspace back_and_forth
