bindcode $mod+81 workspace --no-auto-back-and-forth number $left9; workspace --no-auto-back-and-forth number $right9
bindcode $mod+Mod2+81 workspace --no-auto-back-and-forth number $left9; workspace --no-auto-back-and-forth number $right9
bindcode $mod+90 workspace --no-auto-back-and-forth number $left10; workspace --no-auto-back-and-forth number $right10
bindcode $mod+Mod2+90 workspace --no-auto-back-and-forth number $left10; workspace --no-auto-back-and-forth number $right10

# Move both visible workspaces into a pair and follow the originally focused window.
set $pair_move_all [workspace="__focused__"] move --no-auto-back-and-forth container to workspace number

bindcode $mod+Shift+87 \
    $move_focus_begin; \
    focus output DP-1; $pair_move_all $left1; \
    focus output HDMI-0; $pair_move_all $right1; \
    workspace --no-auto-back-and-forth number $left1; \
    workspace --no-auto-back-and-forth number $right1; \
    $move_focus_end
bindcode $mod+Shift+Mod2+87 \
