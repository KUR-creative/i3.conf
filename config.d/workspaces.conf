# Numeric prefixes preserve ordering; suffixes are displayed by i3bar.
set $right1 "1:1"
set $right2 "2:2"
set $right3 "3:3"
set $right4 "4:4"
set $right5 "5:5"
set $right6 "6:6"
set $right7 "7:7"
set $right8 "8:8"
set $right9 "9:9"
set $right10 "10:0"

set $left1 "11:F1"
set $left2 "12:F2"
set $left3 "13:F3"
set $left4 "14:F4"
set $left5 "15:F5"
set $left6 "16:F6"
set $left7 "17:F7"
set $left8 "18:F8"
set $left9 "19:F9"
set $left10 "20:F10"

# Shared focus handling for single-window and pair moves.
set $move_focus_begin unmark _i3_move_follow; [con_id=__focused__] mark --add _i3_move_follow
set $move_focus_end [con_mark="^_i3_move_follow$"] focus; unmark _i3_move_follow

# Switch only the right monitor with number keys.
bindsym $mod+1 workspace number $right1
bindsym $mod+2 workspace number $right2
bindsym $mod+3 workspace number $right3
bindsym $mod+4 workspace number $right4
bindsym $mod+5 workspace number $right5
bindsym $mod+6 workspace number $right6
bindsym $mod+7 workspace number $right7
bindsym $mod+8 workspace number $right8
bindsym $mod+9 workspace number $right9
bindsym $mod+0 workspace number $right10

# Move to the right workspace and focus the moved container.
bindsym $mod+Shift+1 \
    $move_focus_begin; \
    move --no-auto-back-and-forth container to workspace number $right1; \
    workspace --no-auto-back-and-forth number $right1; \
    $move_focus_end
bindsym $mod+Shift+2 \
    $move_focus_begin; \
    move --no-auto-back-and-forth container to workspace number $right2; \
    workspace --no-auto-back-and-forth number $right2; \
    $move_focus_end
