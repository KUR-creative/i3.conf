# Keypad pairs: support both Num Lock states; finish on the right monitor.
bindcode $mod+87 workspace --no-auto-back-and-forth number $left1; workspace --no-auto-back-and-forth number $right1
bindcode $mod+Mod2+87 workspace --no-auto-back-and-forth number $left1; workspace --no-auto-back-and-forth number $right1
bindcode $mod+88 workspace --no-auto-back-and-forth number $left2; workspace --no-auto-back-and-forth number $right2
bindcode $mod+Mod2+88 workspace --no-auto-back-and-forth number $left2; workspace --no-auto-back-and-forth number $right2
