# Numeric prefixes preserve ordering; suffixes are displayed by i3bar.
set $right1 "1:1"
set $right2 "2:2"
set $right3 "3:3"
set $right4 "4:4"
set $right5 "5:5"
set $right6 "6:6"
set $right7 "7:7"
set $right8 "8:8"
set $right9 "9:9"
set $right10 "10:0"

set $left1 "11:F1"
set $left2 "12:F2"
set $left3 "13:F3"
set $left4 "14:F4"
set $left5 "15:F5"
set $left6 "16:F6"
set $left7 "17:F7"
set $left8 "18:F8"
set $left9 "19:F9"
set $left10 "20:F10"

# Switch only the right monitor with number keys.
bindsym $mod+1 workspace number $right1
bindsym $mod+2 workspace number $right2
bindsym $mod+3 workspace number $right3
bindsym $mod+4 workspace number $right4
bindsym $mod+5 workspace number $right5
bindsym $mod+6 workspace number $right6
bindsym $mod+7 workspace number $right7
bindsym $mod+8 workspace number $right8
bindsym $mod+9 workspace number $right9
bindsym $mod+0 workspace number $right10

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $left1
bindsym $mod+Shift+2 move container to workspace number $right1
bindsym $mod+Shift+3 move container to workspace number $left2
bindsym $mod+Shift+4 move container to workspace number $right2
bindsym $mod+Shift+5 move container to workspace number $left3
bindsym $mod+Shift+6 move container to workspace number $right3
bindsym $mod+Shift+7 move container to workspace number $left4
bindsym $mod+Shift+8 move container to workspace number $right4
bindsym $mod+Shift+9 move container to workspace number $left5
bindsym $mod+Shift+0 move container to workspace number $right5

## My own settings
# Left workspaces (all ten slots)
workspace $left1 output DP-1
workspace $left2 output DP-1
workspace $left3 output DP-1
workspace $left4 output DP-1
workspace $left5 output DP-1
workspace $left6 output DP-1
workspace $left7 output DP-1
workspace $left8 output DP-1
workspace $left9 output DP-1
workspace $left10 output DP-1

# Right workspaces (all ten slots)
workspace $right1 output HDMI-0
workspace $right2 output HDMI-0
workspace $right3 output HDMI-0
workspace $right4 output HDMI-0
workspace $right5 output HDMI-0
workspace $right6 output HDMI-0
workspace $right7 output HDMI-0
workspace $right8 output HDMI-0
workspace $right9 output HDMI-0
workspace $right10 output HDMI-0

# Switch only the left monitor with function keys.
bindsym $mod+F1 workspace number $left1
bindsym $mod+F2 workspace number $left2
bindsym $mod+F3 workspace number $left3
bindsym $mod+F4 workspace number $left4
bindsym $mod+F5 workspace number $left5
bindsym $mod+F6 workspace number $left6
bindsym $mod+F7 workspace number $left7
bindsym $mod+F8 workspace number $left8
bindsym $mod+F9 workspace number $left9
bindsym $mod+F10 workspace number $left10

# Keypad pairs: support both Num Lock states; finish on the right monitor.
bindcode $mod+87 workspace --no-auto-back-and-forth number $left1; workspace --no-auto-back-and-forth number $right1
bindcode $mod+Mod2+87 workspace --no-auto-back-and-forth number $left1; workspace --no-auto-back-and-forth number $right1
bindcode $mod+88 workspace --no-auto-back-and-forth number $left2; workspace --no-auto-back-and-forth number $right2
bindcode $mod+Mod2+88 workspace --no-auto-back-and-forth number $left2; workspace --no-auto-back-and-forth number $right2
bindcode $mod+89 workspace --no-auto-back-and-forth number $left3; workspace --no-auto-back-and-forth number $right3
bindcode $mod+Mod2+89 workspace --no-auto-back-and-forth number $left3; workspace --no-auto-back-and-forth number $right3
bindcode $mod+83 workspace --no-auto-back-and-forth number $left4; workspace --no-auto-back-and-forth number $right4
bindcode $mod+Mod2+83 workspace --no-auto-back-and-forth number $left4; workspace --no-auto-back-and-forth number $right4
bindcode $mod+84 workspace --no-auto-back-and-forth number $left5; workspace --no-auto-back-and-forth number $right5
bindcode $mod+Mod2+84 workspace --no-auto-back-and-forth number $left5; workspace --no-auto-back-and-forth number $right5
bindcode $mod+85 workspace --no-auto-back-and-forth number $left6; workspace --no-auto-back-and-forth number $right6
bindcode $mod+Mod2+85 workspace --no-auto-back-and-forth number $left6; workspace --no-auto-back-and-forth number $right6
bindcode $mod+79 workspace --no-auto-back-and-forth number $left7; workspace --no-auto-back-and-forth number $right7
bindcode $mod+Mod2+79 workspace --no-auto-back-and-forth number $left7; workspace --no-auto-back-and-forth number $right7
bindcode $mod+80 workspace --no-auto-back-and-forth number $left8; workspace --no-auto-back-and-forth number $right8
bindcode $mod+Mod2+80 workspace --no-auto-back-and-forth number $left8; workspace --no-auto-back-and-forth number $right8
bindcode $mod+81 workspace --no-auto-back-and-forth number $left9; workspace --no-auto-back-and-forth number $right9
bindcode $mod+Mod2+81 workspace --no-auto-back-and-forth number $left9; workspace --no-auto-back-and-forth number $right9
bindcode $mod+90 workspace --no-auto-back-and-forth number $left10; workspace --no-auto-back-and-forth number $right10
bindcode $mod+Mod2+90 workspace --no-auto-back-and-forth number $left10; workspace --no-auto-back-and-forth number $right10

# Ctrl+Tab
bindsym Mod1+Tab workspace back_and_forth
