# ============================================================================
# 1. Workspace slots: numeric order and visible labels
# ============================================================================

# Right: 1..9, 0
set $right1 1:1
set $right2 2:2
set $right3 3:3
set $right4 4:4
set $right5 5:5
set $right6 6:6
set $right7 7:7
set $right8 8:8
set $right9 9:9
set $right10 10:0

# Left: F1..F10
set $left1 11:F1
set $left2 12:F2
set $left3 13:F3
set $left4 14:F4
set $left5 15:F5
set $left6 16:F6
set $left7 17:F7
set $left8 18:F8
set $left9 19:F9
set $left10 20:F10

# ============================================================================
# 2. Shared move and focus commands
# ============================================================================

# Single-window moves use two i3-msg calls; the pair helper moves workspace containers.
set $move_focus_begin unmark _i3_move_follow; [con_id=__focused__] mark --add _i3_move_follow
set $move_focus_end [con_mark=^_i3_move_follow$] focus; unmark _i3_move_follow
set $move_one_to move --no-auto-back-and-forth container to workspace number

# ============================================================================
# 3. Monitor assignment
# ============================================================================

# Left monitor
workspace $left1 output DP-1
workspace $left2 output DP-1
workspace $left3 output DP-1
workspace $left4 output DP-1
workspace $left5 output DP-1
workspace $left6 output DP-1
workspace $left7 output DP-1
workspace $left8 output DP-1
workspace $left9 output DP-1
workspace $left10 output DP-1

# Right monitor
workspace $right1 output HDMI-0
workspace $right2 output HDMI-0
workspace $right3 output HDMI-0
workspace $right4 output HDMI-0
workspace $right5 output HDMI-0
workspace $right6 output HDMI-0
workspace $right7 output HDMI-0
workspace $right8 output HDMI-0
workspace $right9 output HDMI-0
workspace $right10 output HDMI-0

# ============================================================================
# 4. Workspace switching
# ============================================================================

# New i3 sessions clear history; reload/restart does not rerun this command.
exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py reset

# Main numbers record the departure workspace and restore each pair's last focused side.
bindsym $mod+1 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 1
bindsym $mod+2 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 2
bindsym $mod+3 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 3
bindsym $mod+4 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 4
bindsym $mod+5 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 5
bindsym $mod+6 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 6
bindsym $mod+7 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 7
bindsym $mod+8 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 8
bindsym $mod+9 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 9
bindsym $mod+0 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 0

bindsym $mod+grave exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 0

# Left only: function keys
bindsym $mod+F1 workspace number $left1
bindsym $mod+F2 workspace number $left2
bindsym $mod+F3 workspace number $left3
bindsym $mod+F4 workspace number $left4
bindsym $mod+F5 workspace number $left5
bindsym $mod+F6 workspace number $left6
bindsym $mod+F7 workspace number $left7
bindsym $mod+F8 workspace number $left8
bindsym $mod+F9 workspace number $left9
bindsym $mod+F10 workspace number $left10

# Keypad: right workspace only, with both Num Lock states.
bindcode $mod+87 workspace --no-auto-back-and-forth number $right1
bindcode $mod+Mod2+87 workspace --no-auto-back-and-forth number $right1
bindcode $mod+88 workspace --no-auto-back-and-forth number $right2
bindcode $mod+Mod2+88 workspace --no-auto-back-and-forth number $right2
bindcode $mod+89 workspace --no-auto-back-and-forth number $right3
bindcode $mod+Mod2+89 workspace --no-auto-back-and-forth number $right3
bindcode $mod+83 workspace --no-auto-back-and-forth number $right4
bindcode $mod+Mod2+83 workspace --no-auto-back-and-forth number $right4
bindcode $mod+84 workspace --no-auto-back-and-forth number $right5
bindcode $mod+Mod2+84 workspace --no-auto-back-and-forth number $right5
bindcode $mod+85 workspace --no-auto-back-and-forth number $right6
bindcode $mod+Mod2+85 workspace --no-auto-back-and-forth number $right6
bindcode $mod+79 workspace --no-auto-back-and-forth number $right7
bindcode $mod+Mod2+79 workspace --no-auto-back-and-forth number $right7
bindcode $mod+80 workspace --no-auto-back-and-forth number $right8
bindcode $mod+Mod2+80 workspace --no-auto-back-and-forth number $right8
bindcode $mod+81 workspace --no-auto-back-and-forth number $right9
bindcode $mod+Mod2+81 workspace --no-auto-back-and-forth number $right9
bindcode $mod+90 workspace --no-auto-back-and-forth number $right10
bindcode $mod+Mod2+90 workspace --no-auto-back-and-forth number $right10

# Previous regular pair and its focused side; update the shared JSON history.
bindsym $mod+Tab exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py previous

# Previous workspace: Alt+Tab (MRU window switching is not implemented).
bindsym Mod1+Tab workspace back_and_forth

# ============================================================================
# 5. Window movement and following focus
# ============================================================================

# Main numbers and grave move each workspace layout as a group; follow the original window.
bindsym $mod+Shift+1 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 1 --move
bindsym $mod+Shift+2 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 2 --move
bindsym $mod+Shift+3 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 3 --move
bindsym $mod+Shift+4 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 4 --move
bindsym $mod+Shift+5 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 5 --move
bindsym $mod+Shift+6 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 6 --move
bindsym $mod+Shift+7 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 7 --move
bindsym $mod+Shift+8 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 8 --move
bindsym $mod+Shift+9 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 9 --move
bindsym $mod+Shift+0 exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 0 --move
bindsym $mod+Shift+grave exec --no-startup-id python3 ~/.config/i3/scripts/workspace-pair.py 0 --move

# Single window to the left; follow in the second IPC request.
bindsym $mod+Shift+F1 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $left1' && \
    i3-msg 'workspace --no-auto-back-and-forth number $left1; $move_focus_end'"
bindsym $mod+Shift+F2 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $left2' && \
    i3-msg 'workspace --no-auto-back-and-forth number $left2; $move_focus_end'"
bindsym $mod+Shift+F3 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $left3' && \
    i3-msg 'workspace --no-auto-back-and-forth number $left3; $move_focus_end'"
bindsym $mod+Shift+F4 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $left4' && \
    i3-msg 'workspace --no-auto-back-and-forth number $left4; $move_focus_end'"
bindsym $mod+Shift+F5 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $left5' && \
    i3-msg 'workspace --no-auto-back-and-forth number $left5; $move_focus_end'"
bindsym $mod+Shift+F6 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $left6' && \
    i3-msg 'workspace --no-auto-back-and-forth number $left6; $move_focus_end'"
bindsym $mod+Shift+F7 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $left7' && \
    i3-msg 'workspace --no-auto-back-and-forth number $left7; $move_focus_end'"
bindsym $mod+Shift+F8 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $left8' && \
    i3-msg 'workspace --no-auto-back-and-forth number $left8; $move_focus_end'"
bindsym $mod+Shift+F9 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $left9' && \
    i3-msg 'workspace --no-auto-back-and-forth number $left9; $move_focus_end'"
bindsym $mod+Shift+F10 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $left10' && \
    i3-msg 'workspace --no-auto-back-and-forth number $left10; $move_focus_end'"

# Single window to the right; support both Num Lock states and follow via two IPC requests.
bindcode $mod+Shift+87 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right1' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right1; $move_focus_end'"
bindcode $mod+Shift+Mod2+87 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right1' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right1; $move_focus_end'"
bindcode $mod+Shift+88 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right2' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right2; $move_focus_end'"
bindcode $mod+Shift+Mod2+88 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right2' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right2; $move_focus_end'"
bindcode $mod+Shift+89 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right3' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right3; $move_focus_end'"
bindcode $mod+Shift+Mod2+89 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right3' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right3; $move_focus_end'"
bindcode $mod+Shift+83 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right4' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right4; $move_focus_end'"
bindcode $mod+Shift+Mod2+83 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right4' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right4; $move_focus_end'"
bindcode $mod+Shift+84 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right5' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right5; $move_focus_end'"
bindcode $mod+Shift+Mod2+84 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right5' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right5; $move_focus_end'"
bindcode $mod+Shift+85 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right6' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right6; $move_focus_end'"
bindcode $mod+Shift+Mod2+85 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right6' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right6; $move_focus_end'"
bindcode $mod+Shift+79 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right7' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right7; $move_focus_end'"
bindcode $mod+Shift+Mod2+79 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right7' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right7; $move_focus_end'"
bindcode $mod+Shift+80 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right8' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right8; $move_focus_end'"
bindcode $mod+Shift+Mod2+80 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right8' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right8; $move_focus_end'"
bindcode $mod+Shift+81 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right9' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right9; $move_focus_end'"
bindcode $mod+Shift+Mod2+81 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right9' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right9; $move_focus_end'"
bindcode $mod+Shift+90 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right10' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right10; $move_focus_end'"
bindcode $mod+Shift+Mod2+90 exec --no-startup-id \
    "i3-msg '$move_focus_begin; $move_one_to $right10' && \
    i3-msg 'workspace --no-auto-back-and-forth number $right10; $move_focus_end'"
